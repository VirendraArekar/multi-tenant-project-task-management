global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'teamboard-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend-1:8080', 'backend-2:8080']
        labels:
          application: 'teamboard-backend'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
