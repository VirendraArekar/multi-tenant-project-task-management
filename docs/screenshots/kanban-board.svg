      <text x="12" y="60" font-size="13" font-weight="600" fill="#f8fafc">Security Check Aspect</text>
      <rect x="12" y="80" width="56" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="40" y="93" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Security</text>
      <circle cx="196" cy="89" r="10" fill="#f59e0b"/>
      <text x="196" y="93" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">MW</text>
