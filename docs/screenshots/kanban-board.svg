      <text x="40" y="93" text-anchor="middle" font-size="10" font-weight="600" fill="#34d399">Database</text>
      <circle cx="196" cy="89" r="10" fill="#3b82f6"/>
      <text x="196" y="93" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">DK</text>
