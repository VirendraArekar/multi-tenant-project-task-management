server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: teamboard-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/teamboard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:teamboard_user}
    password: ${SPRING_DATASOURCE_PASSWORD:teamboard_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: TeamBoardHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: teamboard-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

app:
  jwt:
    secret: ${JWT_SECRET:dGVhbWJvYXJkLXN1cGVyLXNlY3JldC1qd3Qta2V5LXdpdGgtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900} # 15 minutes
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800} # 7 days
  rate-limit:
    enabled: true
    default-capacity: 60
    default-refill-tokens-per-minute: 60
    auth-capacity: 10
    auth-refill-tokens-per-minute: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80,http://localhost}
  kafka:
    topics:
      task-events: task-events
      comment-events: comment-events
      membership-events: membership-events
      overdue-events: overdue-events
      dead-letter: teamboard-dead-letter

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-none}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.teamboard: DEBUG
    org.springframework.security: INFO
    org.apache.kafka: WARN
